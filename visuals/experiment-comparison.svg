<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc">
  <title id="title">Virtual-platform experiment comparison</title><desc id="desc">Grouped bar charts compare makespan and DRAM traffic for the single LLC baseline and three LLC plus four scratchpad scenario.</desc>
  <style>text{font-family:Arial,sans-serif;fill:#172a3a}.title{font-size:26px;font-weight:700}.label{font-size:15px}.value{font-size:14px;font-weight:600}.axis{stroke:#718096;stroke-width:1}.grid{stroke:#d9e2ec;stroke-width:1}</style>
  <rect width="1100" height="560" fill="white"/><text x="55" y="48" class="title">Memory-orchestration experiment results</text><text x="55" y="75" class="label">LT-model results under the configuration assumptions; values are for architectural comparison, not chip measurements.</text>
  <g transform="translate(90,130)"><text x="0" y="-25" class="label" font-weight="700">Workload makespan (ms)</text><path d="M0 300H420M0 0V300" class="axis"/><path d="M0 225H420M0 150H420M0 75H420" class="grid"/><text x="-32" y="304" class="label">0</text><text x="-32" y="229" class="label">1</text><text x="-32" y="154" class="label">2</text><text x="-32" y="79" class="label">3</text><text x="-32" y="4" class="label">4</text><rect x="95" y="0" width="100" height="300" fill="#4361ee"/><rect x="260" y="169" width="100" height="131" fill="#2a9d8f"/><text x="145" y="-10" text-anchor="middle" class="value">4.29</text><text x="310" y="159" text-anchor="middle" class="value">1.87</text><text x="145" y="330" text-anchor="middle" class="label">1 LLC</text><text x="310" y="330" text-anchor="middle" class="label">3 LLC + 4 SPAD</text></g>
  <g transform="translate(650,130)"><text x="0" y="-25" class="label" font-weight="700">External DRAM traffic (MB)</text><path d="M0 300H370M0 0V300" class="axis"/><path d="M0 225H370M0 150H370M0 75H370" class="grid"/><text x="-32" y="304" class="label">0</text><text x="-32" y="229" class="label">2</text><text x="-32" y="154" class="label">4</text><text x="-32" y="79" class="label">6</text><text x="-32" y="4" class="label">8</text><rect x="72" y="55" width="100" height="245" fill="#4361ee"/><rect x="236" y="258" width="100" height="42" fill="#2a9d8f"/><text x="122" y="45" text-anchor="middle" class="value">6.52</text><text x="286" y="248" text-anchor="middle" class="value">1.11</text><text x="122" y="330" text-anchor="middle" class="label">1 LLC</text><text x="286" y="330" text-anchor="middle" class="label">3 LLC + 4 SPAD</text></g>
  <g transform="translate(90,512)"><circle cx="7" cy="-5" r="7" fill="#4361ee"/><text x="22" y="0" class="label">Baseline</text><circle cx="135" cy="-5" r="7" fill="#2a9d8f"/><text x="150" y="0" class="label">Partitioned memory + SPAD</text><text x="530" y="0" class="value">−56.3% modeled makespan · −82.9% modeled DRAM traffic</text></g>
</svg>
